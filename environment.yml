name: flame-train
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pyyaml
  - numpy
  - pytest
  - pip:
      # CPU-only PyTorch (~200 MB instead of ~2 GB with CUDA). The engine service must use the SAME
      # versions of torch and sentence-transformers (embedding.py is shared). Pin them after the first install.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - sentence-transformers
      - pymupdf
      - sqlite-vec
