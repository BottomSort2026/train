[experiment]
name = "flex-outcome-sensitivity"
version = "0.1"
role = "sensitivity"
decisions = ["D-02"]

[comparison]
reference_config = "configs/training/flex_outcome.toml"
max_abs_roc_auc_delta = 0.05
min_spearman = 0.8

[[dataset.extra_exclusions]]
name = "disruption"
column = "test_end"
rule = "equals"
value = "disruption"

[target.class_map]
extinction = "extinction"
completion = "no_extinction"
