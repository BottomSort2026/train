[experiment]
name = "flex-outcome"
version = "0.1"
role = "publishable"
task = "classification"
decisions = ["D-01", "D-03", "D-04", "D-05", "D-06", "D-07", "D-09"]

[dataset]
name = "flex_tests"
accession = "PSI-69"
path = "data/processed/flex_tests.csv"
group_column = "atmosphere_id"
row_key = "table_row"
id_columns = ["cir_id", "testsheet_id", "test_end"]

[[dataset.exclusions]]
name = "duplicate_test"
column = "duplicate_of"
rule = "not_null"

[[dataset.exclusions]]
name = "missing_initial_diameter"
column = "d0_mm"
rule = "is_null"

[[dataset.exclusions]]
name = "high_pressure"
column = "high_pressure"
rule = "is_true"

[[dataset.exclusions]]
name = "unknown_fiber"
column = "fiber"
rule = "is_null"

[target]
column = "test_end"
positive_class = "extinction"
decision_threshold = 0.5

[target.class_map]
extinction = "extinction"
disruption = "no_extinction"
completion = "no_extinction"

[features]
categorical = ["fuel"]
numeric = ["pressure_atm", "o2", "co2", "he", "d0_mm"]
boolean = ["fiber"]

[[features.products]]
name = "po2"
columns = ["o2", "pressure_atm"]

[models.logreg]
role = "baseline"
estimator = "logistic_regression"

[models.logreg.params]
C = 1.0
class_weight = "balanced"
max_iter = 1000

[models.logreg_spline]
role = "candidate"
estimator = "logistic_regression"

[models.logreg_spline.spline]
columns = ["o2", "d0_mm", "co2", "he"]
n_knots = 4
degree = 3

[models.logreg_spline.params]
C = 1.0
class_weight = "balanced"
max_iter = 1000

[models.hgb]
role = "candidate"
estimator = "hist_gradient_boosting_classifier"
calibrated = true

[models.hgb.params]
max_depth = 3
max_iter = 150
learning_rate = 0.05
min_samples_leaf = 15
l2_regularization = 1.0
class_weight = "balanced"
random_state = 0

[cv]
n_splits = 5
n_repeats = 10
shuffle = true
seed = 20261114

[calibration]
method = "sigmoid"
n_splits = 3

[selection]
tie_breaker_metric = "brier"
tie_breaker_direction = "lower"

[[selection.must_beat]]
metric = "macro_f1"
direction = "higher"

[[selection.must_beat]]
metric = "brier"
direction = "lower"

[support]
columns = ["pressure_atm", "o2", "co2", "he", "d0_mm"]
partition_column = "fuel"
range_percentile = 95
nearest_k = 5
low_confidence_below_support = 3
high_confidence_min_support = 5
high_confidence_min_probability = 0.7

[interface]
range_decimals = 2
input_order = ["fuel", "pressure_atm", "o2", "suppressant", "suppressant_fraction", "droplet_d0_mm"]

[interface.fixed_inputs]
fiber = false

[interface.composition]
columns = ["o2", "co2", "he"]
max_sum = 1.0

[interface.selector]
input = "suppressant"
value_input = "suppressant_fraction"
source_column = "suppressant"
empty_value = "none"
unit = "mole fraction"

[interface.selector.columns]
co2 = "co2"
he = "he"

[[interface.direct_inputs]]
name = "fuel"
column = "fuel"
type = "enum"

[[interface.direct_inputs]]
name = "pressure_atm"
column = "pressure_atm"
type = "float"
unit = "atm"

[[interface.direct_inputs]]
name = "o2"
column = "o2"
type = "float"
unit = "mole fraction"

[[interface.direct_inputs]]
name = "droplet_d0_mm"
column = "d0_mm"
type = "float"
unit = "mm"

[report]
pressure_level_decimals = 1
intended_use = """
Estimate, for the simulator and the chatbot, whether the visible flame of a single burning fuel droplet goes \
out on its own in a given microgravity atmosphere, within the conditions FLEX tested. It supports engineering \
judgment and does not replace material certification."""
limitations = [
    "Microgravity only: gravity is not an input, and the prediction must not change with any gravity control.",
    """
The class no_extinction joins tests that burned to completion and tests where the droplet broke apart or left \
its support fiber (disruption). A disruption early in the burn can hide an extinction that would have happened \
later (decision D-01).""",
    """
Extinction means extinction of the visible flame. Heptane droplets can keep burning as a dim cool flame after \
the visible flame goes out.""",
    """
Pressure was tested at two levels only (see the coverage facts). The per-input limits accept any pressure \
between the two levels, and the joint range check only rejects pressures far from both of them.""",
    """
Suppressants (CO2, He) were tested only at moderate oxygen levels. The Moon-like region has tests without \
suppressant only.""",
    "Fiber-supported tests are used for training, but every prediction is made for a free droplet.",
    "Tests above the pressure limit are excluded: there, pressure is confounded with a single CO2 mixture.",
    "The slow imposed flow used in some tests (droplet translation) is not an input.",
]

[[report.reference_queries]]
name = "moon_like_with_co2"

[report.reference_queries.inputs]
fuel = "methanol"
pressure_atm = 0.7
o2 = 0.34
suppressant = "co2"
suppressant_fraction = 0.2
droplet_d0_mm = 3.5

[[report.reference_queries]]
name = "iss_like_air"

[report.reference_queries.inputs]
fuel = "methanol"
pressure_atm = 1.0
o2 = 0.21
suppressant = "none"
suppressant_fraction = 0.0
droplet_d0_mm = 3.0

[[report.reference_queries]]
name = "moon_like_no_suppressant"

[report.reference_queries.inputs]
fuel = "methanol"
pressure_atm = 0.69
o2 = 0.34
suppressant = "none"
suppressant_fraction = 0.0
droplet_d0_mm = 3.5

[[report.reference_queries]]
name = "between_pressure_levels"

[report.reference_queries.inputs]
fuel = "methanol"
pressure_atm = 0.85
o2 = 0.21
suppressant = "none"
suppressant_fraction = 0.0
droplet_d0_mm = 3.0
