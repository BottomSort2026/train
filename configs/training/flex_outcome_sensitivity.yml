# Análisis de sensibilidad de la variable objetivo de flex-outcome (D-02). Nunca se exporta.
# Corre con `python main.py train compare-targets` (este experimento es el valor por defecto).
# Hereda todas las secciones de comparison.reference_config; las secciones de este archivo reemplazan
# claves un nivel hacia abajo (T-02). Solo se escriben las diferencias.

experiment:
  name: flex-outcome-sensitivity
  version: "0.1"
  role: sensitivity
  decisions: [D-02]

comparison:
  reference_config: configs/training/flex_outcome.yml   # relativa a la raíz del repo
  max_abs_roc_auc_delta: 0.05    # "consistentes" si la diferencia absoluta de ROC-AUC es <= 0.05...
  min_spearman: 0.8              # ...y la correlación de Spearman de las probabilidades es >= 0.80

# Opción B: sin los tests de disrupción, extinción contra completación.
dataset:
  extra_exclusions:
    - {name: disruption, column: test_end, rule: equals, value: disruption}

target:
  class_map:
    extinction: extinction
    completion: no_extinction
