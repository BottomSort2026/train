[experiment]
name = "flex-extinction"
version = "0.2"
role = "publishable"
task = "regression"
decisions = ["D-03", "D-04", "D-05", "D-07", "D-08", "D-09"]

[dataset]
name = "flex_tests"
accession = "PSI-69"
path = "data/processed/flex_tests.csv"
group_column = "atmosphere_id"
row_key = "table_row"
id_columns = ["cir_id", "testsheet_id", "test_end"]

[[dataset.exclusions]]
name = "duplicate_test"
column = "duplicate_of"
rule = "not_null"

[[dataset.exclusions]]
name = "missing_initial_diameter"
column = "d0_mm"
rule = "is_null"

[[dataset.exclusions]]
name = "high_pressure"
column = "high_pressure"
rule = "is_true"

[[dataset.exclusions]]
name = "unknown_fiber"
column = "fiber"
rule = "is_null"

[[dataset.exclusions]]
name = "not_extinction"
column = "test_end"
rule = "not_equals"
value = "extinction"

[[dataset.exclusions]]
name = "missing_extinction_diameter"
column = "dext_mm"
rule = "is_null"

[target]
column = "dext_over_d0"
output = "extinction_diameter_ratio"
prediction_bounds = [0.0, 1.0]

[[target.scaled_outputs]]
name = "extinction_diameter_mm"
input = "droplet_d0_mm"

[features]
categorical = ["fuel"]
numeric = ["pressure_atm", "o2", "co2", "he", "d0_mm"]
boolean = ["fiber"]

[[features.products]]
name = "po2"
columns = ["o2", "pressure_atm"]

[models.ridge]
role = "baseline"
estimator = "ridge"

[models.ridge.params]
alpha = 1.0

[models.hgb]
role = "candidate"
estimator = "hist_gradient_boosting_regressor"

[models.hgb.params]
max_depth = 3
max_iter = 150
learning_rate = 0.05
min_samples_leaf = 15
l2_regularization = 1.0
random_state = 0

[cv]
n_splits = 5
n_repeats = 10
shuffle = true
seed = 20261114
stratify_bins = 4

[selection]
tie_breaker_metric = "mae"
tie_breaker_direction = "lower"

[[selection.must_beat]]
metric = "mae"
direction = "lower"

[support]
columns = ["pressure_atm", "o2", "co2", "he", "d0_mm"]
partition_column = "fuel"
range_percentile = 95
nearest_k = 5
low_confidence_below_support = 3
high_confidence_min_support = 5

[evaluation]
region_columns = ["suppressant"]

[evaluation.region_round]
pressure_atm = 1

[interface]
range_decimals = 2
input_order = ["fuel", "pressure_atm", "o2", "suppressant", "suppressant_fraction", "droplet_d0_mm"]

[interface.fixed_inputs]
fiber = false

[interface.composition]
columns = ["o2", "co2", "he"]
max_sum = 1.0

[interface.selector]
input = "suppressant"
value_input = "suppressant_fraction"
source_column = "suppressant"
empty_value = "none"
unit = "mole fraction"

[interface.selector.columns]
co2 = "co2"
he = "he"

[[interface.direct_inputs]]
name = "fuel"
column = "fuel"
type = "enum"

[[interface.direct_inputs]]
name = "pressure_atm"
column = "pressure_atm"
type = "float"
unit = "atm"

[[interface.direct_inputs]]
name = "o2"
column = "o2"
type = "float"
unit = "mole fraction"

[[interface.direct_inputs]]
name = "droplet_d0_mm"
column = "d0_mm"
type = "float"
unit = "mm"

[report]
pressure_level_decimals = 1
intended_use = """
Estimate, for the simulator and the chatbot, how early the visible flame of a burning fuel droplet goes out in a \
given microgravity atmosphere, as the droplet diameter at extinction divided by its initial diameter. A ratio \
near 1 means the flame barely outlived ignition; a small ratio means the droplet burned almost completely. It \
supports engineering judgment and does not replace material certification."""
limitations = [
    """
Conditional model: it describes the tests whose visible flame went out. Whether the flame goes out at all is \
the question of flex-outcome, and this model must be read together with it (decision D-08).""",
    "Microgravity only: gravity is not an input, and the prediction must not change with any gravity control.",
    """
Extinction means extinction of the visible flame. Heptane droplets can keep burning as a dim cool flame after \
the visible flame goes out, so a heptane extinction diameter is not the end of all burning.""",
    """
Extinction diameters were measured only while the droplet stayed in the camera view. Tests without a measured \
diameter are excluded, and the diameters that appear only in the TestSheets are not used (decision D-04).""",
    """
Pressure was tested at two levels only (see the coverage facts). The per-input limits accept any pressure \
between the two levels, and the joint range check only rejects pressures far from both of them.""",
    """
Suppressants (CO2, He) were tested only at moderate oxygen levels. No flame went out in the Moon-like region, \
so this model has no training rows there.""",
    "Fiber-supported tests are used for training, but every prediction is made for a free droplet.",
    "Tests above the pressure limit are excluded: there, pressure is confounded with a single CO2 mixture.",
    "Predictions are clipped to the physical range of the ratio.",
]

[[report.reference_queries]]
name = "iss_like_air"

[report.reference_queries.inputs]
fuel = "methanol"
pressure_atm = 1.0
o2 = 0.21
suppressant = "none"
suppressant_fraction = 0.0
droplet_d0_mm = 3.0

[[report.reference_queries]]
name = "co2_diluted_low_pressure"

[report.reference_queries.inputs]
fuel = "methanol"
pressure_atm = 0.7
o2 = 0.21
suppressant = "co2"
suppressant_fraction = 0.3
droplet_d0_mm = 3.5

[[report.reference_queries]]
name = "moon_like_no_suppressant"

[report.reference_queries.inputs]
fuel = "methanol"
pressure_atm = 0.69
o2 = 0.34
suppressant = "none"
suppressant_fraction = 0.0
droplet_d0_mm = 3.5
